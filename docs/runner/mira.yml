# Copy to .github/workflows/mira.yml in each repo Mira reviews on GitHub
# Actions. The Mira server dispatches it with these three inputs; it only
# hands them to Mira's reusable workflow. See docs/runner/README.md.
name: Mira

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Set by the Mira server
        type: string
        required: true
      runs_on:
        description: Set by the Mira server
        type: string
        required: true
      server_url:
        description: Set by the Mira server
        type: string
        required: true

permissions: {}

jobs:
  review:
    permissions:
      id-token: write
      contents: read
    uses: elhamnazif/mira/.github/workflows/review.yml@main
    with:
      job_id: ${{ inputs.job_id }}
      runs_on: ${{ inputs.runs_on }}
      server_url: ${{ inputs.server_url }}
    # Named one by one: `secrets: inherit` only reaches a workflow in the
    # same organization or enterprise. Unset ones arrive empty.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      MIRA_LLM_API_KEY: ${{ secrets.MIRA_LLM_API_KEY }}
      ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
