# Throwaway P0 probe for the runner-choice plan. Not for merge.
name: P0 runner probe
on:
  workflow_call:
    inputs:
      job_id: { type: string, required: true }
      runs_on: { type: string, required: false, default: '["ubuntu-latest"]' }
jobs:
  probe:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: OIDC claims (payload only, token never printed)
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mira" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          python3 - "$tok" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ["iss","aud","repository","repository_owner","repository_visibility","job_workflow_ref","workflow_ref","event_name","ref","run_id","runner_environment"]
          print(json.dumps({k: c.get(k) for k in keys}, indent=1))
          PY
          echo "job_id input: ${{ inputs.job_id }}"
      - name: Setup route A (uv tool + npm)
        run: |
          s=$(date +%s)
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install -q "mira-reviewer @ git+https://github.com/elhamnazif/mira@38ec981c4b072574b972e1d21bbdc15ff072e8dc"
          npm i -g -s @anthropic-ai/claude-code@2.1.330
          mira --help | sed -n 3p; claude --version
          echo "ROUTE_A_SECONDS=$(( $(date +%s)-s ))"
      - name: Setup route B (container pull, upstream image as size proxy)
        run: |
          s=$(date +%s)
          docker pull -q ghcr.io/miracodeai/mira:latest
          docker image ls ghcr.io/miracodeai/mira:latest --format '{{.Size}}'
          echo "ROUTE_B_SECONDS=$(( $(date +%s)-s ))"
